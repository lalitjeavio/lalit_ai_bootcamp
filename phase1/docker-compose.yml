services:
  db:
    image: postgres:17
    restart: always
    env_file: ./.env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
  web:
    image: phase1:1.0.0
    build: .
    ports:
      - 5000:5000
    depends_on:
      - db
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
