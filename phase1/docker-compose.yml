services:
  db:
    image: postgres:17
    restart: always
    env_file: ./.env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
  redis:
    image: redis:latest
    ports:
      - 6379:6379
    networks:
      - internal
    
  web:
    image: phase1:1.0.0
    build: .
    ports:
      - 5000:5000
    command: "python main.py"
    depends_on:
      - db
      - redis
    networks:
      - internal

  worker:
    image: phase1:1.0.0
    build: .
    command: celery -A app.extensions.celery_app worker -B -l info
    depends_on:
      - redis
      - db
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
